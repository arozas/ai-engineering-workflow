name: Validate workflow distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate distribution contracts
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Run isolated workflow tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1
