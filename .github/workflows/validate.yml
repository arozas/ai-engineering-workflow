name: Validate workflow distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPPORTED_OPENCODE_PACKAGE: '@opencode-ai/cli@beta'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate distribution contracts
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Run isolated workflow tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: Install supported OpenCode V2 CLI
        shell: pwsh
        run: npm install --global "$env:SUPPORTED_OPENCODE_PACKAGE"

      - name: Verify supported OpenCode V2 CLI
        shell: pwsh
        run: opencode2 --version

      - name: Smoke-test supported OpenCode discovery
        shell: pwsh
        run: ./scripts/smoke-opencode.ps1

  opencode-latest-canary:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install latest OpenCode V2 CLI canary
        shell: pwsh
        run: npm install --global @opencode-ai/cli@beta

      - name: Verify latest OpenCode V2 CLI canary
        shell: pwsh
        run: opencode2 --version

      - name: Smoke-test latest OpenCode discovery
        shell: pwsh
        run: ./scripts/smoke-opencode.ps1
