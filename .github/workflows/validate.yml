name: Validate workflow distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPPORTED_OPENCODE_VERSION: 1.18.26

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate distribution contracts
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Run isolated workflow tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: Install supported OpenCode CLI
        shell: pwsh
        run: npm install --global "opencode-ai@$env:SUPPORTED_OPENCODE_VERSION"

      - name: Smoke-test supported OpenCode discovery
        shell: pwsh
        run: ./scripts/smoke-opencode.ps1

  opencode-latest-canary:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install latest OpenCode CLI canary
        shell: pwsh
        run: npm install --global opencode-ai@latest

      - name: Smoke-test latest OpenCode discovery
        shell: pwsh
        run: ./scripts/smoke-opencode.ps1
